{% extends "auth_base.html" %}
{% block title %}新規登録{% endblock %}
{% block content %}
<h1>新規登録</h1>
<p class="sub">クリニックの管理者から共有された招待コードと、メールアドレス・パスワードを登録してください。</p>

<div id="msg-box" class="msg"></div>

<label for="f-invite">招待コード</label>
<input type="text" id="f-invite" autocomplete="off" placeholder="管理者から共有されたコード">

<label for="f-email">メールアドレス</label>
<input type="email" id="f-email" autocomplete="email" placeholder="you@example.com">

<label for="f-password">パスワード（{{ '' }}8文字以上）</label>
<input type="password" id="f-password" autocomplete="new-password">

<label style="display:flex; align-items:flex-start; gap:6px; margin-top:16px; font-size:0.85rem; color:var(--text);">
  <input type="checkbox" id="f-agree" style="width:auto; margin-top:2px;">
  <span><a href="/terms" target="_blank">利用規約</a>と<a href="/privacy" target="_blank">プライバシーポリシー</a>に同意する</span>
</label>

<button type="button" class="primary" id="f-submit" disabled>登録する</button>

<p class="demo-note">※そのクリニックで最初に登録した方が自動的に「管理者」になります。</p>

<div class="links"><a href="/login">すでにアカウントをお持ちの方はこちら（ログイン）</a></div>

<script>
const msgBox = document.getElementById('msg-box');
function showMsg(html, type) {
  msgBox.className = 'msg ' + type;
  msgBox.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const submitBtn = document.getElementById('f-submit');
const agreeBox = document.getElementById('f-agree');
agreeBox.addEventListener('change', () => {
  submitBtn.disabled = !agreeBox.checked;
});

submitBtn.addEventListener('click', async () => {
  const invite_code = document.getElementById('f-invite').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const password = document.getElementById('f-password').value;

  submitBtn.disabled = true;
  submitBtn.textContent = '登録中...';
  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ invite_code, email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '登録に失敗しました');
    showMsg(
      '登録しました。<br>【デモ用】本来はメールで届く確認リンクです。クリックして確認してください：<br>' +
      '<a href="' + escapeHtml(data.verify_url) + '">' + escapeHtml(data.verify_url) + '</a>',
      'info'
    );
    submitBtn.style.display = 'none';
  } catch (e) {
    showMsg(escapeHtml(e.message), 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = '登録する';
  }
});
</script>
{% endblock %}
