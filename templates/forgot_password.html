{% extends "auth_base.html" %}
{% block title %}パスワード再発行{% endblock %}
{% block content %}
<h1>パスワードをお忘れの方</h1>
<p class="sub">登録済みのメールアドレスを入力してください。</p>

<div id="msg-box" class="msg"></div>

<label for="f-email">メールアドレス</label>
<input type="email" id="f-email" autocomplete="email">

<button type="button" class="primary" id="f-submit">再設定リンクを発行する</button>

<div class="links"><a href="/login">ログイン画面に戻る</a></div>

<script>
const msgBox = document.getElementById('msg-box');
function showMsg(html, type) {
  msgBox.className = 'msg ' + type;
  msgBox.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const submitBtn = document.getElementById('f-submit');
submitBtn.addEventListener('click', async () => {
  const email = document.getElementById('f-email').value.trim();

  submitBtn.disabled = true;
  submitBtn.textContent = '発行中...';
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '処理に失敗しました');

    if (data.reset_url) {
      showMsg(
        '【デモ用】本来はメールで届く再設定リンクです。クリックして進んでください：<br>' +
        '<a href="' + escapeHtml(data.reset_url) + '">' + escapeHtml(data.reset_url) + '</a>',
        'info'
      );
    } else {
      // 登録の有無を区別しないメッセージ（このメールアドレスが未登録でも同じ表示にする）
      showMsg('入力いただいたメールアドレスが登録されていれば、再設定用のリンクが届きます。', 'info');
    }
  } catch (e) {
    showMsg(escapeHtml(e.message), 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = '再設定リンクを発行する';
  }
});
</script>
{% endblock %}
