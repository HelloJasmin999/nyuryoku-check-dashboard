{% extends "auth_base.html" %}
{% block title %}パスワード再設定{% endblock %}
{% block content %}
<h1>新しいパスワードを設定</h1>

{% if not valid %}
<div class="msg error">このリンクは無効か、有効期限が切れています。もう一度パスワード再発行の手続きを行ってください。</div>
<div class="links"><a href="/forgot-password">パスワード再発行をやり直す</a></div>
{% else %}
<p class="sub">新しいパスワードを入力してください（8文字以上）。</p>
<div id="msg-box" class="msg"></div>

<label for="f-password">新しいパスワード</label>
<input type="password" id="f-password" autocomplete="new-password">

<button type="button" class="primary" id="f-submit">パスワードを更新する</button>

<script>
const msgBox = document.getElementById('msg-box');
function showMsg(text, type) {
  msgBox.className = 'msg ' + type;
  msgBox.textContent = text;
}

const submitBtn = document.getElementById('f-submit');
submitBtn.addEventListener('click', async () => {
  const password = document.getElementById('f-password').value;

  submitBtn.disabled = true;
  submitBtn.textContent = '更新中...';
  try {
    const res = await fetch('/api/reset-password/{{ token }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '更新に失敗しました');
    window.location.href = '/login?reset=1';
  } catch (e) {
    showMsg(e.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'パスワードを更新する';
  }
});
</script>
{% endif %}
{% endblock %}
